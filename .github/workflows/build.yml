name: Build

# Two jobs on two runners, so the wall-clock is the longer of them, not their sum: the core's tests
# (the long one, even over four forks) and the app's tests with the debug APK. `apk` is the check
# main requires; `core` must pass too before a merge.

on:
  # Branches build through their pull request; a second run per push doubled the queue for nothing.
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the dependency and build caches: saving them cost every branch run 40 s.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test the core
        run: ./gradlew :core:test

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test the app and build the debug APK
        # The debug variant's unit tests only: the release variant's run in the Release workflow.
        run: ./gradlew :app:testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: better-iptv-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
