name: Unknown Prefixes

# Lists what the cloud couldn't settle of each Provider's Prefix table, in one issue with a section per
# Provider (by host hash): the Prefixes devices reported in the last 30 days that no table knows, the
# Prefixes whose file reads split under the bar, the learned lines that contradict the Base table, and
# the candidate Tier tags Syncs reported in the last 30 days (#439). The curator writes hand lines from
# it, in the Provider's hand file in cloud/provider-tables/, or adds a Prefix most Providers share to the
# Base table (core/src/main/resources/dev/betteriptv/core/prefix-table.txt). A Prefix or Tier tag with a
# hand line drops off the list the next week; with nothing left, the issue is closed. The body is built by
# cloud/scripts/weekly-issue.mjs (tested in cloud/test/weekly-issue.test.ts); nothing is applied by itself.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  issues: write

defaults:
  run:
    working-directory: cloud

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Read what the cloud couldn't settle
        run: |
          query() { npx wrangler d1 execute better-iptv --remote --json --command "$2" > "$1"; }
          query unknowns.json "
            SELECT provider, prefix, listing_count AS listings, example, first_seen
            FROM unknown_prefix
            WHERE last_seen > (unixepoch() - 30 * 86400) * 1000"
          query splits.json "
            SELECT provider, prefix, attribute, reads, shares
            FROM learned_line
            WHERE status = 'split'"
          query learned.json "
            SELECT provider, prefix, attribute, value, reads, agreeing
            FROM learned_line
            WHERE status = 'learned'"
          query tier-tags.json "
            SELECT provider, word, listing_count AS listings, example, first_seen, last_seen
            FROM tier_tag_candidate
            WHERE last_seen > (unixepoch() - 30 * 86400) * 1000"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open, update or close the issue
        run: |
          title="Unknown Prefixes"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          node scripts/weekly-issue.mjs unknowns.json splits.json learned.json tier-tags.json > body.md
          if [ ! -s body.md ]; then
            [ -n "$issue" ] && gh issue close "$issue" --comment "Nothing left to settle: no unknown Prefixes or candidate Tier tags reported in the last 30 days, and no split or contradicting learned lines."
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh issue create --title "$title" --label needs-triage --body-file body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
