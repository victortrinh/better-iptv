name: Unknown Prefixes

# Lists the Prefixes devices reported in the last 30 days that the Prefix table doesn't know, in one
# issue with a section per Provider (by host hash), so they get added to the Base table
# (core/src/main/resources/dev/betteriptv/core/prefix-table.txt) when most Providers share them, or
# to the Provider's hand file in cloud/provider-tables/. A Prefix the table has learned stops
# being reported and drops off the list; with none left, the issue is closed.

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  issues: write

defaults:
  run:
    working-directory: cloud

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: Read the reported Prefixes
        run: |
          npx wrangler d1 execute better-iptv --remote --json --command "
            SELECT provider, prefix, listing_count AS listings, example, first_seen
            FROM unknown_prefix
            WHERE last_seen > (unixepoch() - 30 * 86400) * 1000
            ORDER BY provider, listings DESC, prefix" > prefixes.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open, update or close the issue
        run: |
          title="Unknown Prefixes"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          count=$(jq '.[0].results | length' prefixes.json)
          if [ "$count" -eq 0 ]; then
            [ -n "$issue" ] && gh issue close "$issue" --comment "No unknown Prefixes reported in the last 30 days."
            exit 0
          fi
          {
            echo "Devices' Syncs found these Prefixes that the Prefix table doesn't know, in the last 30 days."
            echo "Add each to the Base table, \`core/src/main/resources/dev/betteriptv/core/prefix-table.txt\`, when most Providers share it, or else to the Provider's hand file in \`cloud/provider-tables/\`; the Viewer never sees this list."
            echo "Each section is one Provider, by the SHA-256 of its host: its hand file is \`cloud/provider-tables/<hash>.txt\`. Providers with the most unknown Listings come first."
            jq -r '
              .[0].results | group_by(.provider) | sort_by(-(map(.listings) | add))[] |
              "\n### `\(.[0].provider)`\n\n\(length) Prefix\(if length == 1 then "" else "es" end), \(map(.listings) | add) Listings.\n\n| Prefix | Listings | Example | First seen |\n| --- | ---: | --- | --- |",
              (.[] | "| `\(.prefix)` | \(.listings) | \(.example | gsub("\\|"; "\\|")) | \(.first_seen / 1000 | strftime("%Y-%m-%d")) |")
            ' prefixes.json
          } > body.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file body.md
          else
            gh issue create --title "$title" --label needs-triage --body-file body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
